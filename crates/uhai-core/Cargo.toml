[package]
name = "uhai-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "uhai_core"
crate-type = ["cdylib", "rlib"]

[features]
python = ["dep:pyo3", "pyo3/extension-module"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.9"
rand_chacha = "0.9"
pyo3 = { version = "=0.27.2", optional = true }
