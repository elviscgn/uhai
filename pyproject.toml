[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "uhai"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "numpy>=2.2,<3"]

[dependency-groups]
dev = ["maturin>=1.9,<2", "pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.maturin]
manifest-path = "crates/uhai-core/Cargo.toml"
features = ["python"]
module-name = "uhai_core"
profile = "release"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
